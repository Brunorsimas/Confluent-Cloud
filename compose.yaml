services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U payments_admin -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
